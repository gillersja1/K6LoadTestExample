name: Azure Load Testing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test-plans/**'
      - 'loadtest-config.yaml'
      - '.github/workflows/azure-load-test.yml'

jobs:
  load-test:
    name: Run Azure Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Authenticates using a Microsoft Entra service principal stored as
      # the AZURE_CREDENTIALS secret (JSON output of `az ad sp create-for-rbac`,
      # scoped to the "Load Test Contributor" role on your Load Testing
      # resource). See the README for the exact az CLI commands.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Load Testing
        uses: azure/load-testing@v1
        with:
          loadTestConfigFile: 'loadtest-config.yaml'
          loadTestResource: ${{ vars.AZURE_LOAD_TEST_RESOURCE }}
          resourceGroup: ${{ vars.AZURE_LOAD_TEST_RESOURCE_GROUP }}

      # The action writes results (including a CSV summary) to ./loadTest
      - name: Publish load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-load-test-results
          path: loadTest/
