version: v0.1
testId: reqres-api-load-test
displayName: ReqRes API Load Test
description: 'Cloud-scale load test of the reqres.in test API, run via Azure Load Testing'

testPlan: reqres-api-load-test.jmx
testType: JMX

# Each engine instance runs the full thread group defined in the JMX file
# (default: 10 threads, 10s ramp-up, 5 loops - see the JMX's __P() defaults).
# Increase engineInstances to scale out horizontally rather than editing the
# script's thread count directly.
engineInstances: 1

# Optional: override the JMX's ${__P(...)} defaults without touching the
# script itself. Uncomment and add a user.properties file alongside this
# config to set threads/rampup/loops/thinkTimeMs from here instead.
# properties:
#   userPropertyFile: 'user.properties'

failureCriteria:
  - avg(response_time_ms) > 1000
  - percentage(error) > 10
  - p95(response_time_ms) > 2000

autoStop:
  errorPercentage: 90
  timeWindow: 60
